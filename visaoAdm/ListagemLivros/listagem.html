<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Livros</title>
    <link rel="stylesheet" href="listagem.css">

    <link rel="stylesheet" href="../../styles/global.css">

    <link rel="shortcut icon" href="../../imgs/Icone - Bibliotec.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body class="pagina-listagem">
    <aside class="menu-lateral">
        <div class="topo-menu">
            <button class="botao-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <img class="logo" src="../../imgs/Logo Vertical - clara.svg" alt="">
        </div>

        <nav class="menu-navegacao">

            <a href="#" class="item-menu">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-user-plus"></i>
                <span>Cadastrar Usuário</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-user-group"></i>
                <span>Listar usuários</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-book-medical"></i>
                <span>Cadastrar Livro</span>
            </a>

            <a href="#" class="item-menu ativo">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>Listar Livros</span>
            </a>

            <a href="#" class="item-menu">
                <i class="fa-solid fa-address-book"></i>
                <span>Livros Reservados</span>
            </a>

        </nav>

        <a href="../../login/login.html" class="botao-sair">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair</span>
        </a>
    </aside>

    <main class="conteudo-listagem">
        <section class="cabecalho-pagina">
            <h1>Listar Livros</h1>
            <p>Gerencie e acompanhe os livros cadastrados</p>
        </section>

        <section class="card-listagem">

            <div class="area-busca">

                <div class="campo-busca">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar livro por nome...">
                </div>

                <button class="botao-filtro">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Filtros</span>
                </button>
            </div>

            <div class="cabecalho-lista">
                <h2>Nome</h2>
                <h2>Reservado</h2>
                <h2>Categoria</h2>
                <h2>Editar</h2>
                <h2>Detalhes</h2>
            </div>
        </section>
    </main>
</body>

</html>
